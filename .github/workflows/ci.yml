name: project-ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: python

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - name: Install
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
      - name: Prepare media tools
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
          ffprobe -version
      - name: Static and architecture gates
        run: python scripts/run_checks.py --require-dev-tools --skip-tests
      - name: Fast tests
        run: |
          New-Item -ItemType Directory -Force -Path ../.dev-data/temp/checks | Out-Null
          python -m pytest -q -m "not integration and not slow and not network and not gpu" --basetemp=../.dev-data/temp/checks/pytest-fast

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - name: Install
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
      - name: Prepare media tools
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
          ffprobe -version
      - name: Integration tests
        run: python -m pytest -q -m "integration or windows"

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - name: Install
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
      - name: Prepare media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Full release gate
        run: python scripts/run_checks.py --require-dev-tools

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: ""
          - os: ubuntu-24.04
            compiler: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S AudioService -B build/native -DCMAKE_BUILD_TYPE=Release -DAUDIOSERVICE_WARNINGS_AS_ERRORS=ON ${{ matrix.compiler }}
      - run: cmake --build build/native --config Release --parallel 2
      - run: ctest --test-dir build/native -C Release --output-on-failure
