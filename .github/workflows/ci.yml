name: project-ci

on:
  push:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'release: ') && 'release' || 'checks' }}
  cancel-in-progress: >-
    ${{ !startsWith(github.event.head_commit.message, 'release: ') }}

defaults:
  run:
    working-directory: python

jobs:
  fast:
    runs-on: windows-latest
    strategy: &python-shards
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      TEST_MARKER: not integration and not slow and not network and not gpu
    steps:
      - uses: actions/checkout@v4
      - &python-setup
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - &python-cache
        name: Restore installed Python dependencies
        uses: actions/cache@v4
        id: python-cache
        with:
          path: python/.venv
          key: python-cpu-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('python/requirements.lock', 'python/pyproject.toml') }}
      - &python-activate
        name: Activate isolated Python environment
        shell: pwsh
        run: |
          if (-not (Test-Path .venv)) {
            python -m venv .venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $bin = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $bin).Path | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - &python-install
        name: Install
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
      - &media-cache
        name: Restore Windows media tools
        uses: actions/cache@v4
        with:
          path: .dev-data/tools/ffmpeg
          key: windows-ffmpeg-9.1-b9bbbb3a
      - &media-prepare
        name: Prepare media tools
        shell: pwsh
        working-directory: .
        run: |
          $mediaRoot = Join-Path $env:GITHUB_WORKSPACE '.dev-data/tools/ffmpeg'
          $mediaBin = Join-Path $mediaRoot 'ffmpeg-9.1-essentials_build/bin'
          if (-not (Test-Path "$mediaBin/ffmpeg.exe") -or -not (Test-Path "$mediaBin/ffprobe.exe")) {
            New-Item -ItemType Directory -Force $mediaRoot | Out-Null
            $archive = Join-Path $mediaRoot 'ffmpeg.zip'
            try {
              curl.exe --fail --location --retry 5 --retry-all-errors --output $archive https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.1-essentials_build.zip
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd') {
                throw 'FFmpeg archive checksum mismatch.'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath $mediaRoot -Force
            } finally {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            }
          }
          $mediaBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "$mediaBin/ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$mediaBin/ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static and architecture gates
        if: matrix.shard == 0
        run: python scripts/run_checks.py --require-dev-tools --skip-tests
      - &python-tests
        name: Sequential tests on an isolated runner
        shell: pwsh
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: ${{ strategy.job-total }}
        run: |
          @'
          import os
          from pathlib import Path
          import subprocess
          import sys

          files = sorted(Path('tests').rglob('test_*.py'))
          selected = files[int(os.environ['TEST_SHARD'])::int(os.environ['TEST_SHARDS'])]
          marker = ['-m', os.environ['TEST_MARKER']] if os.environ.get('TEST_MARKER') else []
          Path('../.dev-data/temp/checks').mkdir(parents=True, exist_ok=True)
          raise SystemExit(subprocess.call([
              sys.executable, '-m', 'pytest', '-q', '--durations=15',
              '--basetemp=../.dev-data/temp/checks/pytest', *marker, *map(str, selected),
          ]))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  integration:
    runs-on: windows-latest
    strategy: *python-shards
    env:
      TEST_MARKER: integration or windows
    steps:
      - uses: actions/checkout@v4
      - *python-setup
      - *python-cache
      - *python-activate
      - *python-install
      - *media-cache
      - *media-prepare
      - *python-tests

  release:
    runs-on: ubuntu-latest
    strategy: *python-shards
    steps:
      - uses: actions/checkout@v4
      - *python-setup
      - *python-cache
      - *python-activate
      - *python-install
      - name: Prepare media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Release static and architecture gates
        if: matrix.shard == 0
        run: python scripts/run_checks.py --require-dev-tools --skip-tests
      - *python-tests

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        shard: [0, 1, 2]
        include:
          - os: windows-latest
            compiler: ""
          - os: ubuntu-24.04
            compiler: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S AudioService -B build/native -DCMAKE_BUILD_TYPE=Release -DAUDIOSERVICE_WARNINGS_AS_ERRORS=ON -DAUDIOSERVICE_TEST_SHARD=${{ matrix.shard }} ${{ matrix.compiler }}
      - run: cmake --build build/native --config Release --parallel 4
      - run: ctest --test-dir build/native -C Release --output-on-failure

  publish-release:
    needs: [fast, integration, release, frontend, native]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: ')
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: public-windows-release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
        shell: pwsh
    env:
      ORT_DISABLE_TELEMETRY: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check release identity and prepare project temporary files
        id: release-meta
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw 'Application and lockfile release versions must agree.'
          }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git log -1 --format=%s) -ne "release: $version") {
            throw 'The release must use its exact versioned commit.'
          }
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes=$notes" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $releaseTemp = Join-Path $env:GITHUB_WORKSPACE '.dev-data/temp/release'
          New-Item -ItemType Directory -Force $releaseTemp | Out-Null
          "TEMP=$releaseTemp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$releaseTemp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AD_VOICE_PROFILE_ROOT=$releaseTemp/profile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          # The bundled CPU wheels are pinned to cp313 in torch_runtime.py.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked build dependencies
        run: |
          python -m venv python/.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releasePython = '.\python\.venv\Scripts\python.exe'
          & $releasePython -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $releasePython -m pip install -r python/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $releasePython -m pip install -e ./python --no-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - *media-cache
      - *media-prepare
      - name: Prepare installer compiler
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeLicense = Join-Path (Split-Path (Get-Command node.exe).Source) 'LICENSE'
          if (-not (Test-Path $nodeLicense)) { throw 'The Node runtime license is missing.' }
      - name: Build and verify public Windows installer
        shell: cmd
        run: call release.bat
      - name: Verify fresh installation and repair preserve application data
        run: |
          $setup = (Resolve-Path 'release/AD-Voice-Setup.exe').Path
          $installRoot = Join-Path $env:GITHUB_WORKSPACE '.dev-data/release-smoke/installed'
          $logs = Join-Path $env:GITHUB_WORKSPACE 'release-verification'
          New-Item -ItemType Directory -Force $logs | Out-Null
          function Install-Release([string] $phase) {
            $log = Join-Path $logs "$phase.log"
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NORELAUNCH', '/SP-', '/TASKS=', "/DIR=`"$installRoot`"", "/LOG=`"$log`"")
            $process = Start-Process $setup -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(600000)) { throw "Installer timed out: $phase" }
            if ($process.ExitCode -ne 0) { throw "Installer failed: $phase ($($process.ExitCode))" }
          }
          Install-Release 'fresh-install'
          $resources = Join-Path $installRoot 'resources'
          $expected = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $installed = Get-Content (Join-Path $resources 'app/package.json') -Raw | ConvertFrom-Json
          if ($installed.version -ne $expected) { throw 'Installed application version mismatch.' }
          & (Join-Path $resources 'python-runtime/python.exe') -B -I installer/verify_runtime.py $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = Join-Path $installRoot 'data/release-preservation.txt'
          New-Item -ItemType Directory -Force (Split-Path $marker) | Out-Null
          [IO.File]::WriteAllText($marker, "preserve-$env:GITHUB_SHA")
          $module = Join-Path $resources 'python-app/backend/version.py'
          $originalHash = (Get-FileHash $module -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($module, "`n# release repair verification`n")
          Install-Release 'repair-install'
          if ((Get-FileHash $module -Algorithm SHA256).Hash -ne $originalHash) { throw 'Installer did not repair the changed module.' }
          if ([IO.File]::ReadAllText($marker) -ne "preserve-$env:GITHUB_SHA") { throw 'Installer changed preserved application data.' }
          'Fresh installation, installed runtime and repair/data preservation passed.' | Tee-Object -FilePath "$logs/summary.txt"
      - name: Record installer provenance
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item release/AD-Voice-Setup.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $publicEnv = (Get-FileHash python/.env.example -Algorithm SHA256).Hash
          $packedEnv = (Get-FileHash '.release-cache/app/AD Voice/resources/python-app/.env' -Algorithm SHA256).Hash
          if ($publicEnv -ne $packedEnv) { throw 'Public installer environment differs from the public template.' }
          @{
            version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
            commit = $env:GITHUB_SHA
            asset = $setup.Name
            size = $setup.Length
            sha256 = $hash
            signatureStatus = (Get-AuthenticodeSignature $setup.FullName).Status.ToString()
            runtimeVerified = $true
            freshInstallVerified = $true
            repairPreservesDataVerified = $true
            liveAudioVerified = $false
          } | ConvertTo-Json | Set-Content release-verification/installer.json -Encoding utf8
          Get-Content release-verification/installer.json
      - name: Preserve installer and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: AD-Voice-v${{ steps.release-meta.outputs.version }}-${{ github.sha }}
          path: |
            release/AD-Voice-Setup.exe
            release-verification/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish verified installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release-meta.outputs.notes }}
        run: node scripts/publish-github-release.mjs --target "$env:GITHUB_SHA" --notes-file "$env:RELEASE_NOTES"
