name: compact-project-windows-check

on:
  push:

defaults:
  run:
    working-directory: python

jobs:
  compact-project-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8dfdf256ad90c4d5433c9cf0587287766febaf6d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - name: Install
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
      - name: Prepare media tools
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
      - name: Verify compact publication and reported timeout
        run: |
          python -m pytest -q --durations=15 tests/test_project_audio.py tests/test_compact_project.py tests/test_compact_reprocessing.py tests/test_recordings_analysis.py::test_old_analysis_algorithm_is_stale_without_deleting_its_history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
