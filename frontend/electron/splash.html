<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A&amp;D Voice</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    .loader {
      width: 72px;
      height: 72px;
      box-sizing: border-box;
      border: 6px solid color-mix(in srgb, var(--glow) 18%, transparent);
      border-top-color: var(--glow);
      border-radius: 50%;
      filter: drop-shadow(0 0 18px var(--glow-soft));
      animation: spin 850ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader" role="progressbar" aria-label="Loading"></div>
  <script>
    // The main process passes only the theme glow colour; the window itself stays transparent.
    var query = new URLSearchParams(location.search);
    var glow = query.get("glow") || "#ff153f";
    var channel = function (index) { return parseInt(glow.slice(1 + index * 2, 3 + index * 2), 16); };
    document.documentElement.style.setProperty("--glow", glow);
    document.documentElement.style.setProperty("--glow-soft", "rgba(" + channel(0) + "," + channel(1) + "," + channel(2) + ",0.55)");
  </script>
</body>
</html>
