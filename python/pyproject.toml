[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-voice-backend"
version = "1.0.0"
description = "A&D Voice local application backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.40",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "shazamio==0.8.1",
  "yt-dlp>=2026.3.17"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2"
]
ai = ["torch>=2.4", "torchaudio>=2.4", "demucs>=4.1,<5", "openai-whisper>=20250625", "torchcrepe>=0.0.24", "uroman>=1.3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: infrastructure integration test",
  "e2e: end-to-end application flow",
  "slow: intentionally slower test",
  "network: external network test",
  "gpu: requires GPU/CUDA",
  "windows: Windows-specific behavior"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
