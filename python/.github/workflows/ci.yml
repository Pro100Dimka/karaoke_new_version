name: backend-ci

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Static and architecture gates
        run: python scripts/run_checks.py --require-dev-tools --skip-tests
      - name: Fast tests
        run: python -m pytest -q -m "not integration and not slow and not network and not gpu"

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integration tests
        run: python -m pytest -q -m "integration or windows"

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full release gate
        run: python scripts/run_checks.py --require-dev-tools
